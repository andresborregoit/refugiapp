name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: refugiapp_test
          POSTGRES_USER: refugiapp_test
          POSTGRES_PASSWORD: refugiapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refugiapp_test -d refugiapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        run: npm run secrets:scan

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run HTTP and persistence tests
        env:
          E2E_DATABASE_URL: postgresql://refugiapp_test:refugiapp_test@localhost:5432/refugiapp_test
        run: npm run test:e2e
