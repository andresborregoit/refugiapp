name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_DB: refugiapp_test
  POSTGRES_USER: refugiapp_test
  POSTGRES_PASSWORD: refugiapp_test

jobs:
  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Scan tracked files for secrets
        run: npm run secrets:scan

  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  unit:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --runInBand

  migration-validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_SSL: 'false'
      TYPEORM_SYNCHRONIZE: 'false'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: refugiapp_test
          POSTGRES_USER: refugiapp_test
          POSTGRES_PASSWORD: refugiapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refugiapp_test -d refugiapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure database connection
        run: |
          database_scheme='postgresql:'
          echo "DATABASE_URL=${database_scheme}//${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Run migrations on a clean database
        run: npm run migration:run
      - name: Show applied migrations
        run: npm run migration:show

  e2e:
    name: E2E (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: refugiapp_test
          POSTGRES_USER: refugiapp_test
          POSTGRES_PASSWORD: refugiapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refugiapp_test -d refugiapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run HTTP and persistence tests
        env:
          E2E_DATABASE_HOST: localhost
          E2E_DATABASE_PORT: 5432
          E2E_DATABASE_NAME: refugiapp_test
          E2E_DATABASE_USER: refugiapp_test
          E2E_DATABASE_PASSWORD: refugiapp_test
        run: npm run test:e2e

  deployment-validate:
    name: Validate deployment artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      APP_ENV: development
      PORT: 3100
      API_PREFIX: api/v1
      DB_SSL: 'false'
      TYPEORM_SYNCHRONIZE: 'false'
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: refugiapp_test
          POSTGRES_USER: refugiapp_test
          POSTGRES_PASSWORD: refugiapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refugiapp_test -d refugiapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up pinned Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Build production artifact
        run: npm run build
      - name: Configure test database connection
        run: |
          database_scheme='postgresql:'
          echo "DATABASE_URL=${database_scheme}//${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Run compiled migrations explicitly
        run: npm run migration:run:prod
      - name: Verify compiled migration state
        run: npm run migration:show:prod
      - name: Verify readiness before availability
        run: |
          node dist/main.js > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${PORT}/${API_PREFIX}/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat app.log
          exit 1
      - name: Build pinned container image
        run: docker build --tag refugiapp-api:ci .

  backup-restore-validate:
    name: Validate PostgreSQL backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_SSL: 'false'
      TYPEORM_SYNCHRONIZE: 'false'
      POSTGRES_PASSWORD: rfg50-backup-password-canary
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: refugiapp_test
          POSTGRES_USER: refugiapp_test
          POSTGRES_PASSWORD: rfg50-backup-password-canary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refugiapp_test -d refugiapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up pinned Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Verify PostgreSQL client tools
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
      - name: Configure isolated databases
        run: |
          database_scheme='postgresql:'
          echo "DATABASE_URL=${database_scheme}//${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"
          echo "RESTORE_DATABASE_URL=${database_scheme}//${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/refugiapp_restore_test" >> "$GITHUB_ENV"
          psql "${database_scheme}//${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}" --set ON_ERROR_STOP=1 --command 'CREATE DATABASE refugiapp_restore_test'
      - name: Run migrations on source database
        run: npm run migration:run
      - name: Backup, restore and compare isolated databases
        env:
          DATABASE_PASSWORD_CANARY: rfg50-backup-password-canary
          JWT_SECRET_CANARY: ci-only-jwt-canary-not-for-runtime
        run: npm run backup:verify

  verify:
    name: Verify all checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        secrets,
        lint,
        build,
        unit,
        migration-validate,
        e2e,
        deployment-validate,
        backup-restore-validate,
      ]
    steps:
      - name: Confirm required checks passed
        run: echo "All required CI checks passed."
